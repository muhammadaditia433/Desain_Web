<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tugas 2 JavaScript - Data Pegawai</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        color: #333;
      }

      .container {
        width: 90%;
        max-width: 1000px;
        margin: 50px auto;
      }

      .header {
        background-color: #273c75;
        color: white;
        text-align: center;
        padding: 25px;
        border-radius: 10px 10px 0 0;
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .header p {
        margin: 0;
        font-size: 14px;
      }

      .table-box {
        background-color: white;
        padding: 25px;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead {
        background-color: #273c75;
        color: white;
      }

      th,
      td {
        padding: 13px 12px;
        border: 1px solid #ddd;
        text-align: center;
      }

      th {
        font-size: 14px;
      }

      td {
        font-size: 14px;
      }

      tbody tr:hover {
        background-color: #f5f6fa;
      }

      tfoot {
        background-color: #eef1ff;
        font-weight: bold;
      }

      .total {
        color: #273c75;
        font-size: 15px;
      }

      @media (max-width: 700px) {
        .container {
          width: 95%;
          margin: 25px auto;
        }

        .header h1 {
          font-size: 22px;
        }

        th,
        td {
          padding: 10px 8px;
          font-size: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Data Pegawai</h1>
        <p>Tugas 2 JavaScript</p>
      </div>

      <div class="table-box">
        <table>
          <!-- Judul kolom -->
          <thead>
            <tr>
              <th>Nama Pegawai</th>
              <th>Umur</th>
              <th>Jabatan</th>
              <th>Status</th>
              <th>Gaji Pokok</th>
              <th>Tunjangan Jabatan</th>
              <th>BPJS</th>
              <th>Tunjangan Keluarga</th>
              <th>Total Gaji</th>
            </tr>
          </thead>

          <!-- Data pegawai -->
          <tbody id="dataPegawai"></tbody>

          <!-- Total keseluruhan -->
          <tfoot>
            <tr>
              <td colspan="8">Total Gaji</td>
              <td class="total" id="totalGaji"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <script>
      // Data pegawai
      let nama = "Dodi Prayodi";
      let umur = 25;
      let jabatan = "Manajer";
      let status = "Menikah";

      // Menentukan gaji pokok berdasarkan jabatan
      let gajiPokok;

      if (jabatan == "Manajer") {
        gajiPokok = 15000000;
      } else if (jabatan == "Asisten Manajer") {
        gajiPokok = 10000000;
      } else if (jabatan == "Staff") {
        gajiPokok = 5000000;
      } else {
        gajiPokok = 0;
      }

      // Menghitung tunjangan jabatan
      let tunjanganJabatan = (gajiPokok * 15) / 100;

      // Menghitung BPJS
      let bpjs = (gajiPokok * 10) / 100;

      // Tunjangan keluarga menggunakan ternary
      let tunjanganKeluarga = status == "Menikah" ? (gajiPokok * 20) / 100 : 0;

      // Menghitung total gaji
      let totalGaji = gajiPokok + tunjanganJabatan + bpjs + tunjanganKeluarga;

      // Mengubah angka menjadi format Rupiah
      function rupiah(angka) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          minimumFractionDigits: 0,
        }).format(angka);
      }

      // Menampilkan data ke dalam tbody
      document.getElementById("dataPegawai").innerHTML = `
            <tr>
                <td>${nama}</td>
                <td>${umur} Tahun</td>
                <td>${jabatan}</td>
                <td>${status}</td>
                <td>${rupiah(gajiPokok)}</td>
                <td>${rupiah(tunjanganJabatan)}</td>
                <td>${rupiah(bpjs)}</td>
                <td>${rupiah(tunjanganKeluarga)}</td>
                <td>${rupiah(totalGaji)}</td>
            </tr>
        `;

      // Menampilkan total gaji pada tfoot
      document.getElementById("totalGaji").innerHTML = rupiah(totalGaji);
    </script>
  </body>
</html>
