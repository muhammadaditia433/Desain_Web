<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk Toko</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Daftar Produk Toko</h1>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama Produk</th>
                    <th>Harga</th>
                    <th>Stok</th>
                </tr>
            </thead>

            <tbody id="daftarProduk">
            </tbody>
        </table>
    </div>

    <script>
        let produkToko = [
            {
                id: 1,
                nama: "Laptop",
                harga: 7000000,
                stok: 5
            },
            {
                id: 2,
                nama: "Mouse",
                harga: 200000,
                stok: 10
            },
            {
                id: 3,
                nama: "Keyboard",
                harga: 350000,
                stok: 7
            }
        ];

        function tambahProduk(nama, harga, stok) {
            let idBaru = produkToko.length + 1;

            let produkBaru = {
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            };

            produkToko.push(produkBaru);
        }

        function hapusProduk(id) {
            let index = produkToko.findIndex(function(produk) {
                return produk.id === id;
            });

            if (index !== -1) {
                produkToko.splice(index, 1);
            }
        }

        function tampilkanProduk() {
            let tabel = document.getElementById("daftarProduk");

            tabel.innerHTML = "";

            produkToko.forEach(function(produk) {
                tabel.innerHTML += `
                    <tr>
                        <td>${produk.id}</td>
                        <td>${produk.nama}</td>
                        <td>Rp ${produk.harga.toLocaleString("id-ID")}</td>
                        <td>${produk.stok}</td>
                    </tr>
                `;
            });
        }

        // Menampilkan produk awal
        tampilkanProduk();

        // Contoh menambahkan produk
        tambahProduk("Headset", 450000, 8);

        // Menampilkan kembali setelah produk ditambahkan
        tampilkanProduk();

        // Contoh menghapus produk
        // hapusProduk(2);
        // tampilkanProduk();
    </script>

</body>
</html>
