<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Produk</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 900px;
        margin: auto;
        background-color: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
      }

      .form-produk {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      #btnTambah {
        background-color: #333;
        color: white;
      }

      .hapus {
        background-color: #dc3545;
        color: white;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
      }

      th {
        background-color: #333;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f8f8f8;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Manajemen Produk</h1>

      <div class="form-produk">
        <input type="text" id="namaProduk" placeholder="Nama produk" />
        <input type="number" id="hargaProduk" placeholder="Harga" />

        <button id="btnTambah">Tambah Produk</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Produk</th>
            <th>Harga</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="daftarProduk"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
