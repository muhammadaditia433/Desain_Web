<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas 1 JavaScript - Menghitung Luas</title>
  </head>
  <body>
    <h1>Tugas 1 - JavaScript</h1>
    <h2>Menghitung Luas Bangun Datar</h2>

    <script>
      // ==========================================
      // 1. Menghitung Luas Persegi Panjang
      // Rumus: Luas = panjang × lebar
      // ==========================================
      function luasPersegiPanjang(panjang, lebar) {
        return panjang * lebar;
      }

      // Nilai panjang dan lebar
      let panjang = 10;
      let lebar = 5;

      // Menghitung luas persegi panjang
      let hasilPersegiPanjang = luasPersegiPanjang(panjang, lebar);

      document.write("<h3>1. Persegi Panjang</h3>");
      document.write("Panjang = " + panjang + " cm<br>");
      document.write("Lebar = " + lebar + " cm<br>");
      document.write("Luas = " + hasilPersegiPanjang + " cm²<br><br>");

      // ==========================================
      // 2. Menghitung Luas Bujur Sangkar
      // Rumus: Luas = sisi × sisi
      // ==========================================
      function luasBujurSangkar(sisi) {
        return sisi * sisi;
      }

      // Nilai sisi
      let sisi = 7;

      // Menghitung luas bujur sangkar
      let hasilBujurSangkar = luasBujurSangkar(sisi);

      document.write("<h3>2. Bujur Sangkar</h3>");
      document.write("Sisi = " + sisi + " cm<br>");
      document.write("Luas = " + hasilBujurSangkar + " cm²<br><br>");

      // ==========================================
      // 3. Menghitung Luas Segitiga
      // Rumus: Luas = 1/2 × alas × tinggi
      // ==========================================
      function luasSegitiga(alas, tinggi) {
        return 0.5 * alas * tinggi;
      }

      // Nilai alas dan tinggi
      let alas = 8;
      let tinggi = 6;

      // Menghitung luas segitiga
      let hasilSegitiga = luasSegitiga(alas, tinggi);

      document.write("<h3>3. Segitiga</h3>");
      document.write("Alas = " + alas + " cm<br>");
      document.write("Tinggi = " + tinggi + " cm<br>");
      document.write("Luas = " + hasilSegitiga + " cm²<br>");
    </script>
  </body>
</html>
