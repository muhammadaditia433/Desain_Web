<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Eksternal -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-4">

    <h2>Gallery Saya</h2>
    <p>Berikut beberapa foto dan sertifikat saya.</p>

    <div class="row g-3">

        <!-- Foto 1 -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card gallery-card">

                <img src="images/banner1.svg"
                     class="card-img-top img-fluid"
                     alt="Galeri 1">

                <div class="card-body">
                    <p class="card-text">Foto 1</p>
                </div>

            </div>
        </div>

        <!-- Foto 2 -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card gallery-card">

                <img src="images/banner2.svg"
                     class="card-img-top img-fluid"
                     alt="Galeri 2">

                <div class="card-body">
                    <p class="card-text">Foto 2</p>
                </div>

            </div>
        </div>

        <!-- Foto 3 -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card gallery-card">

                <img src="images/banner3.svg"
                     class="card-img-top img-fluid"
                     alt="Galeri 3">

                <div class="card-body">
                    <p class="card-text">Foto 3</p>
                </div>

            </div>
        </div>

        <!-- Sertifikat -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card gallery-card">

                <img src="images/gambar.jpeg"
                     class="card-img-top img-fluid"
                     alt="Sertifikat 1">

                <div class="card-body">
                    <p class="card-text">Sertifikat 1</p>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
